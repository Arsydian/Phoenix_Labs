# Cloudflare Workers with Static Assets Configuration
# Phoenix Labs Academy — Edge LMS Runtime
name = "phoenix-labs-academy"
main = "src/worker/index.ts"
compatibility_date = "2024-11-01"

# Automatically compile the Vite React SPA before Worker bundle upload
[build]
command = "npm run build"

# Serves the compiled Vite React SPA from ./dist
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[observability]
enabled = true
